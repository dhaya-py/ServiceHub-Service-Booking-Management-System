<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting - Provider Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar will be injected here -->
        <nav class="sidebar"></nav>

        <div class="main-content">
            <!-- Navbar will be injected here -->
            <header class="top-navbar d-flex justify-content-between align-items-center"></header>

            <div class="dashboard-content">
                <!-- Summary Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                                <i class="bi bi-wallet2"></i>
                            </div>
                            <div class="stat-details">
                                <h3 class="stat-title">Total Earnings</h3>
                                <div class="stat-value" id="totalEarnings">₹0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Payments Table -->
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 text-primary"><i class="bi bi-cash-stack me-2"></i>My Payout Ledger</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Date</th>
                                        <th>Transaction ID</th>
                                        <th>Booking ID</th>
                                        <th>Customer</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="paymentsTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center py-4">
                                            <div class="spinner-border text-primary"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js?v=4"></script>
    <script src="../../js/utils.js?v=4"></script>
    <script src="../../js/api-client.js?v=4"></script>
    <script src="../../js/auth.js?v=4"></script>
    <script src="../../js/dashboard-component.js?v=4"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize dashboard
            DashboardComponent.init('provider', 'Earnings & Accounting');
            
            try {
                const response = await api.get(API_ENDPOINTS.PROVIDER_PAYMENTS);
                const tbody = document.getElementById('paymentsTableBody');
                
                document.getElementById('totalEarnings').textContent = Utils.formatCurrency(response.total_earnings);

                if (!response.payments || response.payments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No transactions found</td></tr>';
                    return;
                }

                let html = '';
                response.payments.forEach(payment => {
                    html += `
                        <tr>
                            <td>${Utils.formatDate(payment.created_at)}</td>
                            <td><span class="font-monospace text-muted">${payment.transaction_id || 'N/A'}</span></td>
                            <td>#${payment.booking_id}</td>
                            <td>${payment.customer_name || 'N/A'}</td>
                            <td class="fw-bold text-success">${Utils.formatCurrency(payment.amount)}</td>
                            <td><span class="badge bg-success">completed</span></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

            } catch (error) {
                console.error(error);
                document.getElementById('paymentsTableBody').innerHTML = 
                    '<tr><td colspan="6" class="text-center py-4 text-danger">Error loading ledger.</td></tr>';
            }
        });
    </script>
</body>
</html>
