<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability - ServiceHub</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <nav class="top-navbar"></nav>

            <div class="content-area pt-3">
                <div class="row">
                    <div class="col-md-7 mb-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0 fw-bold">Weekly Schedule</h5>
                                <button class="btn btn-sm btn-outline-primary" onclick="saveAvailability()">Save Changes</button>
                            </div>
                            <div class="card-body" id="availabilityContainer">
                                <div class="text-center py-5">
                                    <div class="spinner-border text-primary"></div>
                                    <p class="mt-2 text-muted">Loading schedule...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-5 mb-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0 fw-bold">Time Off</h5>
                                <button class="btn btn-sm btn-primary" onclick="Utils.showToast('Add time off coming soon', 'info')"><i class="bi bi-plus"></i> Add</button>
                            </div>
                            <div class="card-body">
                                <ul class="list-group list-group-flush" id="timeoffContainer">
                                    <div class="text-center py-4 text-muted small border rounded bg-light mt-2">
                                        <i class="bi bi-calendar-event fs-3 d-block mb-2"></i>
                                        No upcoming time off scheduled
                                    </div>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js?v=3"></script>
    <script src="../../js/api-client.js?v=3"></script>
    <script src="../../js/auth.js?v=3"></script>
    <script src="../../js/utils.js?v=3"></script>
    <script src="../../js/dashboard-component.js?v=3"></script>
    
    <script>
        DashboardComponent.init(USER_ROLES.PROVIDER, 'Availability');

        async function loadAvailability() {
            try {
                // Fetch existing availabilities
                const data = await api.get(API_ENDPOINTS.PROVIDER_AVAILABILITY);
                
                // Map API data back to 0-6 array
                const scheduleMap = {};
                if (Array.isArray(data)) {
                    data.forEach(item => { 
                        const uiDay = item.weekday === 7 ? 0 : item.weekday;
                        scheduleMap[uiDay] = item; 
                    });
                }

                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                let html = '';

                for(let i=0; i<7; i++) {
                    const today = scheduleMap[i] || {};
                    const isActive = today.is_active !== false;
                    const start = today.start_time || '09:00';
                    const end = today.end_time || '17:00';

                    html += `
                        <div class="d-flex align-items-center mb-3 p-3 border rounded ${isActive ? 'bg-white' : 'bg-light'}">
                            <div class="form-check form-switch me-4" style="min-width: 120px;">
                                <input class="form-check-input" type="checkbox" id="day_${i}" ${isActive ? 'checked' : ''} onchange="toggleDay(this, ${i})">
                                <label class="form-check-label fw-bold" for="day_${i}">${days[i]}</label>
                            </div>
                            <div class="d-flex align-items-center flex-grow-1" id="time_inputs_${i}" style="opacity: ${isActive ? '1' : '0.5'}; pointer-events: ${isActive ? 'auto' : 'none'};">
                                <input type="time" class="form-control form-control-sm me-2" value="${start}">
                                <span class="text-muted mx-2">to</span>
                                <input type="time" class="form-control form-control-sm ms-2" value="${end}">
                            </div>
                        </div>
                    `;
                }

                document.getElementById('availabilityContainer').innerHTML = html;
            } catch(error) {
                Utils.handleError(error, 'availabilityContainer');
            }
        }

        window.toggleDay = function(checkbox, dayIndex) {
            const inputs = document.getElementById(`time_inputs_${dayIndex}`);
            const parent = checkbox.closest('.border');
            if (checkbox.checked) {
                inputs.style.opacity = '1';
                inputs.style.pointerEvents = 'auto';
                parent.classList.remove('bg-light');
                parent.classList.add('bg-white');
            } else {
                inputs.style.opacity = '0.5';
                inputs.style.pointerEvents = 'none';
                parent.classList.remove('bg-white');
                parent.classList.add('bg-light');
            }
        };

        async function saveAvailability() {
            const btn = document.querySelector('button[onclick^="saveAvailability"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';
            btn.disabled = true;

            try {
                const schedule = [];
                for(let i=0; i<7; i++) {
                    const isActive = document.getElementById(`day_${i}`).checked;
                    const inputs = document.getElementById(`time_inputs_${i}`).querySelectorAll('input[type="time"]');
                    const start_time = inputs[0].value;
                    const end_time = inputs[1].value;
                    
                    const backendWeekday = i === 0 ? 7 : i;
                    
                    if (start_time && end_time) {
                        schedule.push({
                            weekday: backendWeekday,
                            start_time: start_time.length === 5 ? start_time + ':00' : start_time,
                            end_time: end_time.length === 5 ? end_time + ':00' : end_time,
                            is_active: isActive
                        });
                    }
                }

                await api.put(API_ENDPOINTS.PROVIDER_AVAILABILITY, { schedule });
                Utils.showToast('Availability saved successfully', 'success');
            } catch (error) {
                Utils.handleError(error);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAvailability();
        });
    </script>
</body>
</html>
