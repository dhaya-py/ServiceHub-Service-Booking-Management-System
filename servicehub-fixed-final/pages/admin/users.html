<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <nav class="top-navbar"></nav>

            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">User Management</h4>
                </div>

                <!-- Filters -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-5">
                                <input type="text" class="form-control" id="searchUser" placeholder="Search by name or email...">
                            </div>
                            <div class="col-md-4">
                                <select class="form-select" id="roleFilter">
                                    <option value="">All Roles</option>
                                    <option value="customer">Customers</option>
                                    <option value="provider">Providers</option>
                                    <option value="admin">Admins</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-primary w-100" onclick="loadUsers()">Apply Filters</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>User</th>
                                        <th>Role</th>
                                        <th>Created At</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center py-5">
                                            <div class="spinner-border text-primary" role="status"></div>
                                            <p class="mt-2 text-muted">Loading users...</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- User Details Modal -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">User Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="userModalBody">
                    <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary"></div></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js?v=3"></script>
    <script src="../../js/api-client.js?v=3"></script>
    <script src="../../js/auth.js?v=3"></script>
    <script src="../../js/utils.js?v=3"></script>
    <script src="../../js/dashboard-component.js?v=3"></script>
    
    <script>
        DashboardComponent.init(USER_ROLES.ADMIN, 'Manage Users');

        let allUsers = [];
        let userModal;

        async function loadUsers() {
            const tbody = document.getElementById('usersTableBody');
            try {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>';
                
                // For a real app, query parameters should be passed here based on UI
                // We'll filter on frontend for simplicity if backend returns all
                let query = '';
                const roleF = document.getElementById('roleFilter').value;
                if(roleF) query += `?role=${roleF}`;
                
                const data = await api.get(API_ENDPOINTS.ADMIN_USERS + query);
                allUsers = data.items || data || [];

                // Frontend search filter as fallback
                const searchQ = document.getElementById('searchUser').value.toLowerCase();
                let filtered = allUsers;
                if (searchQ) {
                    filtered = filtered.filter(u => 
                        (u.name && u.name.toLowerCase().includes(searchQ)) || 
                        (u.email && u.email.toLowerCase().includes(searchQ))
                    );
                }

                if (!filtered || filtered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted"><i class="bi bi-people fs-1 d-block mb-3"></i>No users found.</td></tr>`;
                    return;
                }

                let html = '';
                filtered.forEach(u => {
                    const badgeClass = u.role === 'admin' ? 'bg-danger' : (u.role === 'provider' ? 'bg-info text-dark' : 'bg-secondary');
                    const statusBadge = u.is_active !== false 
                        ? `<span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25">Active</span>`
                        : `<span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25">Inactive</span>`;

                    html += `
                        <tr>
                            <td>#${u.id}</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="avatar-circle bg-primary text-white d-flex align-items-center justify-content-center rounded-circle me-3" style="width: 40px; height: 40px;">
                                        ${u.email.substring(0,2).toUpperCase()}
                                    </div>
                                    <div>
                                        <div class="fw-bold">${u.name || 'N/A'}</div>
                                        <div class="text-muted small">${u.email}</div>
                                    </div>
                                </div>
                            </td>
                            <td><span class="badge ${badgeClass} text-uppercase">${u.role}</span></td>
                            <td>${Utils.formatDate(u.created_at)}</td>
                            <td>${statusBadge}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-light me-1" onclick="viewUser(${u.id})" title="View Details"><i class="bi bi-eye"></i></button>
                                <button class="btn btn-sm ${u.is_active !== false ? 'btn-outline-danger' : 'btn-outline-success'}" onclick="toggleUserStatus(${u.id}, ${u.is_active !== false})" title="${u.is_active !== false ? 'Deactivate User' : 'Activate User'}">
                                    <i class="bi bi-${u.is_active !== false ? 'x-circle' : 'check-circle'}"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

            } catch (error) {
                Utils.handleError(error);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Failed to load users.</td></tr>`;
            }
        }

        function viewUser(id) {
            const u = allUsers.find(x => x.id === id);
            if(!u) return;

            document.getElementById('userModalBody').innerHTML = `
                <div class="text-center mb-4">
                    <div class="avatar-circle bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-circle mb-3 border border-4 border-light shadow-sm" style="width: 80px; height: 80px; font-size: 2rem;">
                        ${u.email.substring(0,2).toUpperCase()}
                    </div>
                    <h5>${u.name || 'N/A'}</h5>
                    <span class="badge bg-secondary text-uppercase">${u.role}</span>
                </div>
                <table class="table table-sm table-borderless">
                    <tbody>
                        <tr><th class="text-muted w-25">ID:</th><td>${u.id}</td></tr>
                        <tr><th class="text-muted">Email:</th><td>${u.email}</td></tr>
                        <tr><th class="text-muted">Phone:</th><td>${u.phone || 'N/A'}</td></tr>
                        <tr><th class="text-muted">Joined:</th><td>${Utils.formatDate(u.created_at)}</td></tr>
                        <tr><th class="text-muted">Address:</th><td>${u.address || 'N/A'}</td></tr>
                    </tbody>
                </table>
            `;
            userModal.show();
        }

        async function toggleUserStatus(id, currentlyActive) {
            const action = currentlyActive ? 'deactivate' : 'activate';
            const confirmed = await Utils.confirmAction(`Are you sure you want to ${action} this user?`);
            if(!confirmed) return;

            try {
                if (API_ENDPOINTS.ADMIN_USER_ACTIVATE) {
                    await api.put(API_ENDPOINTS.ADMIN_USER_ACTIVATE(id) + "?active=" + !currentlyActive);
                } else {
                    await api.put(`/admin/users/${id}/activate?active=${!currentlyActive}`);
                }
                Utils.showToast(`User ${action}d successfully.`, 'success');
                loadUsers();
            } catch (error) {
                Utils.handleError(error);
            }
        }

        document.getElementById('searchUser').addEventListener('keypress', (e) => { if(e.key === 'Enter') loadUsers(); });
        document.getElementById('roleFilter').addEventListener('change', loadUsers);

        document.addEventListener('DOMContentLoaded', () => {
            userModal = new bootstrap.Modal(document.getElementById('userModal'));
            loadUsers();
        });
    </script>
</body>
</html>
