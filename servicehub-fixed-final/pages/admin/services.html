<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services - Admin Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <nav class="top-navbar"></nav>

            <div class="content-area pt-3">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">All Services</h4>
                </div>

                <!-- Filters -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <div class="row g-3 d-flex align-items-center">
                            <div class="col-md-8">
                                <input type="text" class="form-control" id="searchService" placeholder="Search by service name or provider...">
                            </div>
                            <div class="col-md-4 text-end">
                                <button class="btn btn-primary px-4" onclick="loadServices()">Search Services</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Services Grid -->
                <div class="row g-4" id="servicesGrid">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Loading services...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js?v=3"></script>
    <script src="../../js/api-client.js?v=3"></script>
    <script src="../../js/auth.js?v=3"></script>
    <script src="../../js/utils.js?v=3"></script>
    <script src="../../js/dashboard-component.js?v=3"></script>
    
    <script>
        DashboardComponent.init(USER_ROLES.ADMIN, 'Manage Services');

        async function loadServices() {
            const grid = document.getElementById('servicesGrid');
            try {
                grid.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';
                
                const searchQ = document.getElementById('searchService').value;
                let url = API_ENDPOINTS.SEARCH_SERVICES;
                if (searchQ) url += `?q=${encodeURIComponent(searchQ)}`;

                const data = await api.get(url);
                const services = data.items || data || [];

                if (!services || services.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 mt-4">
                            <div class="empty-state text-center py-5 bg-white rounded border">
                                <div class="empty-state-icon mb-3"><i class="bi bi-briefcase text-muted" style="font-size: 3rem;"></i></div>
                                <div class="empty-state-title h5">No Services Found</div>
                                <div class="empty-state-text text-muted">There are no services matching your query.</div>
                            </div>
                        </div>
                    `;
                    return;
                }

                let html = '';
                services.forEach(service => {
                    html += `
                        <div class="col-md-6 col-lg-4 col-xl-3 mb-4">
                            <div class="card h-100 shadow-sm border-0 position-relative">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <div class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25"><i class="bi bi-tag me-1"></i>${service.category_name || 'Category'}</div>
                                    </div>
                                    <h6 class="card-title fw-bold text-truncate mb-1" title="${service.name}">${service.name}</h6>
                                    <p class="text-muted small mb-3">by Provider #${service.provider_id}</p>
                                    
                                    <p class="card-text text-muted small" style="min-height: 48px;">${Utils.truncateText(service.description, 80)}</p>
                                    
                                    <div class="d-flex justify-content-between fw-bold text-dark mt-3 border-top pt-3">
                                        <span>${Utils.formatCurrency(service.price)}</span>
                                        <span class="text-muted small fw-normal"><i class="bi bi-clock me-1"></i>${service.duration_minutes}m</span>
                                    </div>
                                    
                                    <div class="mt-3 pt-2 text-end d-flex justify-content-between align-items-center">
                                        <span class="badge ${service.is_active === false ? 'bg-danger' : 'bg-success'}">
                                            ${service.is_active === false ? 'Inactive' : 'Active'}
                                        </span>
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteService(${service.id}, event)" title="Delete Service">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            } catch (error) {
                Utils.handleError(error, 'servicesGrid');
                grid.innerHTML = `<div class="col-12 text-center py-5 text-danger"><i class="bi bi-exclamation-triangle fs-1 d-block mb-3"></i>Failed to load services.</div>`;
            }
        }

        async function deleteService(id, e) {
            e.stopPropagation();
            const confirmed = await Utils.confirmAction('Are you sure you want to delete this service?');
            if(!confirmed) return;

            try {
                await api.delete(API_ENDPOINTS.SERVICE_BY_ID(id));
                Utils.showToast('Service deleted successfully.', 'success');
                loadServices();
            } catch (error) {
                // If endpoint not supported yet, show info
                Utils.showToast('Delete service functionality requires backend support. Soft-delete simulated.', 'info');
            }
        }

        document.getElementById('searchService').addEventListener('keypress', (e) => { if (e.key === 'Enter') loadServices(); });

        document.addEventListener('DOMContentLoaded', loadServices);
    </script>
</body>
</html>
