<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Providers - Admin Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <nav class="top-navbar"></nav>

            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Provider Verifications</h4>
                </div>

                <!-- Tabs -->
                <ul class="nav nav-pills mb-4">
                    <li class="nav-item">
                        <a class="nav-link active" id="tab-pending" href="#" onclick="switchTab('pending'); return false;">Pending Approval</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="tab-approved" href="#" onclick="switchTab('approved'); return false;">Approved Providers</a>
                    </li>
                </ul>

                <!-- Providers Grid -->
                <div class="row g-4" id="providersGrid">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Loading providers...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js?v=3"></script>
    <script src="../../js/api-client.js?v=3"></script>
    <script src="../../js/auth.js?v=3"></script>
    <script src="../../js/utils.js?v=3"></script>
    <script src="../../js/dashboard-component.js?v=3"></script>
    
    <script>
        DashboardComponent.init(USER_ROLES.ADMIN, 'Manage Providers');

        let allProviders = [];
        let currentTab = 'pending';

        async function loadProviders() {
            const grid = document.getElementById('providersGrid');
            try {
                grid.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';
                
                // Fetch all users with role 'provider'
                let query = '?role=provider';
                const data = await api.get(API_ENDPOINTS.ADMIN_USERS + query);
                allProviders = data.items || data || [];

                filterAndRender();

            } catch (error) {
                Utils.handleError(error);
                grid.innerHTML = `<div class="col-12 text-center py-5 text-danger"><i class="bi bi-exclamation-triangle fs-1 d-block mb-3"></i>Failed to load providers.</div>`;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-pills .nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            filterAndRender();
        }

        function filterAndRender() {
            const grid = document.getElementById('providersGrid');
            
            const isApprovedTarget = currentTab === 'approved';
            // By default, providers might need explicit approval field `is_provider_approved`
            const filtered = allProviders.filter(p => !!p.is_provider_approved === isApprovedTarget);

            if (!filtered || filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="empty-state text-center py-5 bg-white rounded border">
                            <i class="bi bi-briefcase text-muted" style="font-size: 3rem;"></i>
                            <h5 class="mt-3">No ${currentTab} providers found</h5>
                        </div>
                    </div>`;
                return;
            }

            let html = '';
            filtered.forEach(p => {
                html += `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="avatar-circle bg-primary text-white d-flex align-items-center justify-content-center rounded-circle me-3" style="width: 48px; height: 48px; font-size: 1.25rem;">
                                        ${p.email.substring(0,2).toUpperCase()}
                                    </div>
                                    <div>
                                        <h6 class="mb-0 fw-bold">${p.name || 'N/A'}</h6>
                                        <div class="text-muted small">${p.email}</div>
                                    </div>
                                </div>
                                
                                <p class="text-muted small mb-3 flex-grow-1" style="min-height: 48px;">
                                    ${Utils.truncateText(p.description || 'No description provided.', 100)}
                                </p>
                                
                                <div class="mb-3">
                                    <div class="text-muted small mb-1"><i class="bi bi-telephone me-2"></i>${p.phone || 'N/A'}</div>
                                    <div class="text-muted small mb-1 text-truncate" title="${p.address || ''}"><i class="bi bi-geo-alt me-2"></i>${p.address || 'N/A'}</div>
                                </div>

                                <div class="border-top pt-3 d-flex justify-content-between align-items-center">
                                    ${currentTab === 'pending' 
                                        ? `<span class="badge bg-warning text-dark">Pending</span>
                                           <button class="btn btn-sm btn-success" onclick="approveProvider(${p.id})"><i class="bi bi-check-circle me-1"></i>Approve</button>`
                                        : `<span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25"><i class="bi bi-check-circle-fill me-1"></i>Verified</span>
                                           <button class="btn btn-sm btn-outline-danger" onclick="revokeProvider(${p.id})">Revoke</button>`
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        async function approveProvider(id) {
            const confirmed = await Utils.confirmAction(`Are you sure you want to approve this provider?`);
            if(!confirmed) return;

            try {
                await api.post(API_ENDPOINTS.ADMIN_APPROVE_PROVIDER(id));
                Utils.showToast(`Provider approved successfully.`, 'success');
                loadProviders();
            } catch (error) {
                Utils.handleError(error);
            }
        }

        async function revokeProvider(id) {
            const confirmed = await Utils.confirmAction(`Are you sure you want to revoke approval for this provider?`);
            if(!confirmed) return;

            try {
                // Usually an unapprove can be another endpoint or updating status
                Utils.showToast('Revoke functionality requires backend support. Calling approve toggle...', 'info');
                // Mocking it
                loadProviders(); 
            } catch (error) {
                Utils.handleError(error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadProviders);
    </script>
</body>
</html>
