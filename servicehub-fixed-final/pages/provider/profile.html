<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Profile - ServiceHub</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <nav class="top-navbar"></nav>

            <div class="content-area pt-3">
                <div class="row" id="profileContainer">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3 text-muted">Loading profile...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js?v=3"></script>
    <script src="../../js/api-client.js?v=3"></script>
    <script src="../../js/auth.js?v=3"></script>
    <script src="../../js/utils.js?v=3"></script>
    <script src="../../js/dashboard-component.js?v=3"></script>
    
    <script>
        DashboardComponent.init(USER_ROLES.PROVIDER, 'My Profile');

        async function loadProfile() {
            try {
                const user = await api.get(API_ENDPOINTS.ME);
                const isApproved = user.is_provider_approved;
                
                const html = `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-body text-center pt-5 border-bottom">
                                <div class="avatar-circle mx-auto bg-primary text-white d-flex align-items-center justify-content-center fw-bold rounded-circle mb-3" style="width: 120px; height: 120px; font-size: 3rem;">
                                    ${user.email.substring(0, 2).toUpperCase()}
                                </div>
                                <h4 class="mb-1">${user.name || 'Provider Account'}</h4>
                                <div class="mb-4">
                                    ${isApproved 
                                        ? '<span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-3 py-2"><i class="bi bi-check-circle-fill me-1"></i> Verified Provider</span>'
                                        : '<span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25 px-3 py-2"><i class="bi bi-exclamation-circle-fill me-1"></i> Pending Approval</span>'
                                    }
                                </div>
                            </div>
                            <div class="card-body">
                                <h6 class="text-uppercase text-muted fw-bold mb-3 small">Contact Info</h6>
                                <p class="mb-3 text-truncate"><i class="bi bi-envelope text-muted me-2"></i> ${user.email}</p>
                                <p class="mb-3 text-truncate"><i class="bi bi-telephone text-muted me-2"></i> ${user.phone || 'Not provided'}</p>
                                <p class="mb-3"><i class="bi bi-geo-alt text-muted me-2"></i> ${user.address || 'Not provided'}</p>
                                <p class="mb-0"><i class="bi bi-calendar3 text-muted me-2"></i> Joined ${Utils.formatDate(user.created_at)}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8 mb-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-header bg-white border-bottom py-3">
                                <h5 class="card-title mb-0 fw-bold">Provider Information</h5>
                            </div>
                            <div class="card-body">
                                <form id="profileForm">
                                    <h6 class="text-uppercase text-muted fw-bold mt-2 border-bottom pb-2 mb-3 small">Personal Details</h6>
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label text-muted small fw-bold">Full Name *</label>
                                            <input type="text" class="form-control" id="name" value="${user.name || ''}" placeholder="E.g. John Doe">
                                        </div>
                                        <div class="col-md-6 mt-3 mt-md-0">
                                            <label class="form-label text-muted small fw-bold">Phone Number *</label>
                                            <input type="tel" class="form-control" id="phone" value="${user.phone || ''}" placeholder="Your contact number">
                                        </div>
                                    </div>
                                    
                                    <h6 class="text-uppercase text-muted fw-bold mt-5 border-bottom pb-2 mb-3 small">Business Details</h6>
                                    <div class="mb-3">
                                        <label class="form-label text-muted small fw-bold">Description / Bio</label>
                                        <textarea class="form-control" id="description" rows="4" placeholder="Tell customers about your experience and services...">${user.description || ''}</textarea>
                                        <div class="form-text">This will be shown on your public profile.</div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label text-muted small fw-bold">Business Address *</label>
                                        <textarea class="form-control" id="address" rows="2" placeholder="Full address for verification">${user.address || ''}</textarea>
                                    </div>

                                    <div class="mt-4 pt-3 border-top d-flex justify-content-end">
                                        <button type="button" class="btn btn-primary px-4" onclick="Utils.showToast('Profile update functionality coming soon!', 'info')">Save Changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('profileContainer').innerHTML = html;
            } catch (error) {
                Utils.handleError(error, 'profileContainer');
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
