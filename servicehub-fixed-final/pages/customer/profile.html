<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - ServiceHub</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <nav class="top-navbar"></nav>

            <div class="content-area">
                <div class="row" id="profileContainer">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3 text-muted">Loading profile...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js?v=2"></script>
    <script src="../../js/api-client.js?v=2"></script>
    <script src="../../js/auth.js?v=2"></script>
    <script src="../../js/utils.js?v=2"></script>
    <script src="../../js/dashboard-component.js?v=2"></script>
    
    <script>
        DashboardComponent.init(USER_ROLES.CUSTOMER, 'My Profile');

        async function loadProfile() {
            try {
                const user = await api.get(API_ENDPOINTS.ME);
                
                const html = `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100">
                            <div class="card-body text-center pt-5">
                                <div class="avatar-circle mx-auto bg-primary text-white d-flex align-items-center justify-content-center fw-bold rounded-circle mb-3" style="width: 120px; height: 120px; font-size: 3rem;">
                                    ${user.email.substring(0, 2).toUpperCase()}
                                </div>
                                <h4 class="mb-1">${user.name || 'User'}</h4>
                                <p class="text-muted mb-4">${user.role.toUpperCase()}</p>
                                <hr>
                                <div class="text-start p-2">
                                    <p class="mb-3"><i class="bi bi-envelope text-muted me-2"></i> ${user.email}</p>
                                    <p class="mb-3"><i class="bi bi-telephone text-muted me-2"></i> ${user.phone || 'Not provided'}</p>
                                    <p class="mb-3"><i class="bi bi-geo-alt text-muted me-2"></i> ${user.address || 'Not provided'}</p>
                                    <p class="mb-0"><i class="bi bi-calendar3 text-muted me-2"></i> Member Since ${Utils.formatDate(user.created_at)}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8 mb-4">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title mb-4">Update Profile Information</h5>
                                <form id="profileForm">
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Full Name</label>
                                            <input type="text" class="form-control" id="name" value="${user.name || ''}" placeholder="Enter your full name">
                                        </div>
                                        <div class="col-md-6 mt-3 mt-md-0">
                                            <label class="form-label">Phone</label>
                                            <input type="tel" class="form-control" id="phone" value="${user.phone || ''}" placeholder="Enter your phone number">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" value="${user.email}" disabled>
                                        <div class="form-text">Email cannot be changed directly.</div>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">Address</label>
                                        <textarea class="form-control" id="address" rows="3" placeholder="Enter your full address">${user.address || ''}</textarea>
                                    </div>
                                    <button type="button" class="btn btn-primary" onclick="Utils.showToast('Profile update functionality coming soon!', 'info')">Save Changes</button>
                                </form>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('profileContainer').innerHTML = html;
            } catch (error) {
                Utils.handleError(error, 'profileContainer');
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
