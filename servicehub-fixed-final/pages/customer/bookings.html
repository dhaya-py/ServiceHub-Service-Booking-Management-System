<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - ServiceHub</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dashboard-layout.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <nav class="top-navbar"></nav>

            <div class="content-area">
                <!-- Filter Tabs -->
                <ul class="nav nav-tabs mb-4" id="bookingTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="all-tab" data-bs-toggle="tab" data-bs-target="#all" type="button" role="tab">
                            All Bookings
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="upcoming-tab" data-bs-toggle="tab" data-bs-target="#upcoming" type="button" role="tab">
                            Upcoming
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="past-tab" data-bs-toggle="tab" data-bs-target="#past" type="button" role="tab">
                            Past
                        </button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content" id="bookingTabContent">
                    <!-- All Bookings -->
                    <div class="tab-pane fade show active" id="all" role="tabpanel">
                        <div id="allBookingsContent">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary"></div>
                                <p class="mt-3">Loading bookings...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Upcoming Bookings -->
                    <div class="tab-pane fade" id="upcoming" role="tabpanel">
                        <div id="upcomingBookingsContent"></div>
                    </div>

                    <!-- Past Bookings -->
                    <div class="tab-pane fade" id="past" role="tabpanel">
                        <div id="pastBookingsContent"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Booking Detail Modal -->
    <div class="modal fade" id="bookingDetailModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Booking Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="bookingDetailBody"></div>
                <div class="modal-footer" id="bookingDetailFooter"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js?v=2"></script>
    <script src="../../js/api-client.js?v=2"></script>
    <script src="../../js/auth.js?v=2"></script>
    <script src="../../js/utils.js?v=2"></script>
    <script src="../../js/dashboard-component.js?v=2"></script>
    
    <script>
        DashboardComponent.init(USER_ROLES.CUSTOMER, 'My Bookings');

        let allBookings = [];
        let bookingModal;

        async function loadBookings() {
            try {
                allBookings = await api.get(API_ENDPOINTS.CUSTOMER_BOOKINGS);
                
                renderAllBookings(allBookings);
                renderUpcomingBookings(allBookings);
                renderPastBookings(allBookings);

            } catch (error) {
                console.error('Error loading bookings:', error);
                Utils.handleError(error);
                document.getElementById('allBookingsContent').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Failed to load bookings. Please try again.
                    </div>
                `;
            }
        }

        function renderAllBookings(bookings) {
            const container = document.getElementById('allBookingsContent');
            
            if (!bookings || bookings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="bi bi-calendar-x"></i></div>
                        <div class="empty-state-title">No Bookings Yet</div>
                        <div class="empty-state-text">Start by booking your first service</div>
                        <a href="../services.html" class="btn btn-primary mt-3">Browse Services</a>
                    </div>
                `;
                return;
            }

            let html = '<div class="row g-4">';
            
            bookings.forEach(booking => {
                html += createBookingCard(booking);
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function renderUpcomingBookings(bookings) {
            const upcoming = bookings.filter(b => {
                const bookingDate = new Date(b.booking_date);
                return bookingDate >= new Date() && ['pending', 'accepted'].includes(b.status);
            });

            const container = document.getElementById('upcomingBookingsContent');
            
            if (upcoming.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="bi bi-calendar-check"></i></div>
                        <div class="empty-state-title">No Upcoming Bookings</div>
                        <a href="../services.html" class="btn btn-primary mt-3">Book a Service</a>
                    </div>
                `;
                return;
            }

            let html = '<div class="row g-4">';
            upcoming.forEach(booking => {
                html += createBookingCard(booking);
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderPastBookings(bookings) {
            const past = bookings.filter(b => {
                const bookingDate = new Date(b.booking_date);
                return bookingDate < new Date() || ['completed', 'cancelled', 'rejected'].includes(b.status);
            });

            const container = document.getElementById('pastBookingsContent');
            
            if (past.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="bi bi-clock-history"></i></div>
                        <div class="empty-state-title">No Past Bookings</div>
                    </div>
                `;
                return;
            }

            let html = '<div class="row g-4">';
            past.forEach(booking => {
                html += createBookingCard(booking);
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function createBookingCard(booking) {
            return `
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h5 class="card-title mb-0">${booking.service_name || 'Service'}</h5>
                                ${Utils.getStatusBadge(booking.status)}
                            </div>
                            
                            <div class="mb-2">
                                <i class="bi bi-calendar me-2 text-muted"></i>
                                <span>${Utils.formatDate(booking.booking_date)}</span>
                            </div>
                            
                            <div class="mb-2">
                                <i class="bi bi-clock me-2 text-muted"></i>
                                <span>${Utils.formatTime(booking.booking_time)}</span>
                            </div>
                            
                            <div class="mb-3">
                                <i class="bi bi-person me-2 text-muted"></i>
                                <span>${booking.provider_name || booking.provider_email}</span>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="fs-5 fw-bold text-primary">${Utils.formatCurrency(booking.amount || 0)}</div>
                                <div>
                                    <button class="btn btn-sm btn-outline-primary" onclick="viewBookingDetail(${booking.id})">
                                        View Details
                                    </button>
                                    ${booking.status === 'pending' || booking.status === 'accepted' ? `
                                        <button class="btn btn-sm btn-outline-danger" onclick="cancelBooking(${booking.id})">
                                            Cancel
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function viewBookingDetail(bookingId) {
            try {
                const booking = await api.get(API_ENDPOINTS.BOOKING_BY_ID(bookingId));
                
                const body = document.getElementById('bookingDetailBody');
                body.innerHTML = `
                    <div class="mb-3">
                        <h6>Service</h6>
                        <p>${booking.service_name || 'Service'}</p>
                    </div>
                    <div class="mb-3">
                        <h6>Provider</h6>
                        <p>${booking.provider_name || booking.provider_email}</p>
                    </div>
                    <div class="mb-3">
                        <h6>Date & Time</h6>
                        <p>${Utils.formatDate(booking.booking_date)} at ${Utils.formatTime(booking.booking_time)}</p>
                    </div>
                    <div class="mb-3">
                        <h6>Status</h6>
                        <p>${Utils.getStatusBadge(booking.status)}</p>
                    </div>
                    <div class="mb-3">
                        <h6>Amount</h6>
                        <p class="fs-5 fw-bold text-primary">${Utils.formatCurrency(booking.amount || 0)}</p>
                    </div>
                    <div class="mb-3">
                        <h6>Booking ID</h6>
                        <p><code>#${booking.id}</code></p>
                    </div>
                `;

                const footer = document.getElementById('bookingDetailFooter');
                footer.innerHTML = '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>';

                bookingModal.show();

            } catch (error) {
                Utils.handleError(error);
            }
        }

        async function cancelBooking(bookingId) {
            const confirmed = await Utils.confirmAction('Are you sure you want to cancel this booking?');
            if (!confirmed) return;

            try {
                await api.post(API_ENDPOINTS.CANCEL_BOOKING(bookingId));
                Utils.showToast('Booking cancelled successfully', 'success');
                loadBookings(); // Reload bookings

            } catch (error) {
                Utils.handleError(error);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            bookingModal = new bootstrap.Modal(document.getElementById('bookingDetailModal'));
            loadBookings();
        });
    </script>
</body>
</html>
